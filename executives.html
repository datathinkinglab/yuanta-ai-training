<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>유안타증권 임원 교육 — AI로 읽는 경쟁환경, 경영 브리핑과 실행 리더십</title>
  <style>
    :root {
      --navy: #101D35;
      --navy-light: #1B2E52;
      --teal: #39B8B2;
      --teal-dark: #288f8a;
      --teal-bg: #EAF8F7;
      --white: #FFFFFF;
      --gray-50: #F8FAFC;
      --gray-100: #F1F5F9;
      --gray-200: #E2E8F0;
      --gray-300: #CBD5E1;
      --gray-600: #475569;
      --gray-700: #334155;
      --gray-800: #1E293B;
      --amber: #D97706;
      --amber-bg: #FEF3C7;
      --blue: #2563EB;
      --blue-bg: #EFF6FF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #09101D;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', '맑은 고딕', sans-serif;
      color: var(--gray-800);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: text;
    }

    /* 16:9 Presentation Stage */
    #stage-wrapper {
      width: 1600px;
      height: 900px;
      position: relative;
      transform-origin: center center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65);
      background: var(--white);
      overflow: hidden;
      border-radius: 4px;
    }

    /* Slide Base */
    .slide {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .slide.theme-navy {
      background-color: var(--navy);
      color: var(--white);
    }

    .slide.theme-white {
      background-color: var(--white);
      color: var(--gray-800);
    }

    /* Top Header for Content Slides */
    .slide-header {
      height: 76px;
      padding: 0 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--gray-200);
      background: var(--white);
      flex-shrink: 0;
    }

    .header-module-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .module-badge {
      background-color: var(--navy);
      color: var(--teal);
      font-weight: 700;
      font-size: 14px;
      padding: 5px 12px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }

    .module-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--gray-600);
    }

    /* Journey Pill Bar in Header */
    .journey-bar {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .journey-step {
      font-size: 13px;
      font-weight: 600;
      padding: 5px 11px;
      border-radius: 20px;
      color: var(--gray-600);
      background: var(--gray-100);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .journey-step.active {
      background: var(--teal);
      color: var(--navy);
      font-weight: 800;
    }

    .journey-arrow {
      color: var(--gray-300);
      font-size: 12px;
    }

    /* Main Slide Content Area */
    .slide-body {
      flex: 1;
      padding: 40px 60px 28px 60px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    .title-area {
      margin-bottom: 24px;
    }

    .slide-title {
      font-size: 38px;
      font-weight: 800;
      color: var(--navy);
      line-height: 1.25;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .slide-lead {
      font-size: 21px;
      color: var(--gray-600);
      margin-top: 10px;
      line-height: 1.5;
      font-weight: 500;
    }

    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 20px;
      min-height: 0;
    }

    /* Bottom Notice / Key Takeaway Bar */
    .bottom-message {
      margin-top: 18px;
      background: var(--gray-50);
      border-left: 5px solid var(--teal);
      padding: 14px 22px;
      font-size: 19px;
      font-weight: 700;
      color: var(--navy);
      border-radius: 0 8px 8px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    /* Slide Footer / Controls */
    .slide-footer {
      height: 62px;
      padding: 0 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(148, 163, 184, 0.25);
      font-size: 15px;
      flex-shrink: 0;
      z-index: 20;
    }

    .theme-navy .slide-footer {
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.75);
    }

    .footer-left, .footer-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .footer-copyright {
      font-size: 14px;
      font-weight: 600;
      color: var(--gray-600);
      letter-spacing: 0.2px;
    }

    .theme-navy .footer-copyright {
      color: rgba(255, 255, 255, 0.65);
    }

    .nav-btn {
      background: transparent;
      border: 1px solid var(--gray-300);
      color: var(--gray-700);
      padding: 7px 15px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .nav-btn:hover {
      background: var(--gray-100);
      border-color: var(--navy);
      color: var(--navy);
    }

    .theme-navy .nav-btn {
      border-color: rgba(255, 255, 255, 0.3);
      color: var(--white);
    }

    .theme-navy .nav-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--teal);
    }

    .page-indicator {
      font-size: 16px;
      font-weight: 800;
      padding: 0 12px;
      letter-spacing: 0.5px;
    }

    .page-indicator .current {
      color: var(--teal-dark);
    }

    .theme-navy .page-indicator .current {
      color: var(--teal);
    }

    /* Grid & Cards */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; height: 100%; align-items: stretch; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; height: 100%; align-items: stretch; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; height: 100%; align-items: stretch; }
    .grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; height: 100%; align-items: stretch; }
    .grid-2x2 { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 20px; height: 100%; }

    .card {
      background: var(--white);
      border: 2px solid var(--gray-200);
      border-radius: 12px;
      padding: 26px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 4px 12px rgba(16, 29, 53, 0.04);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    .card:hover {
      border-color: var(--teal);
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(16, 29, 53, 0.09);
    }

    .card.highlight,
    .card.active-box {
      border: 2.5px solid var(--teal) !important;
      background: linear-gradient(180deg, var(--teal-bg) 0%, #FFFFFF 100%);
      box-shadow: 0 12px 28px rgba(57, 184, 178, 0.22);
      transform: translateY(-3px);
    }

    .card.navy-card {
      background: var(--navy);
      color: var(--white);
      border-color: var(--navy);
    }

    .card.navy-card:hover {
      border-color: var(--teal);
    }

    .card.navy-card.active-box {
      background: var(--navy-light) !important;
      border: 2.5px solid var(--teal) !important;
      box-shadow: 0 12px 28px rgba(57, 184, 178, 0.3);
    }

    /* Cover workflow interactive boxes */
    .cover-flow-box {
      padding: 18px;
      background: rgba(255, 255, 255, 0.06);
      border: 1.5px solid rgba(255, 255, 255, 0.14);
      border-left: 5px solid var(--teal);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .cover-flow-box:hover {
      background: rgba(57, 184, 178, 0.12);
      border-color: var(--teal);
      transform: translateX(4px);
    }

    .cover-flow-box.active-box {
      background: rgba(57, 184, 178, 0.22);
      border: 2px solid var(--teal);
      border-left: 6px solid var(--teal);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      transform: translateX(6px);
    }

    .cover-flow-box.active-box .flow-title {
      color: var(--teal);
    }

    /* Cover Partner Logo Bar */
    .cover-logo-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .logo-badge-card {
      background: var(--white);
      padding: 10px 20px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 58px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28);
      border: 1.5px solid rgba(255, 255, 255, 0.85);
    }

    /* Interactive Table Rows & Requirement Boxes */
    .slide-table tbody tr {
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .slide-table tbody tr:hover td {
      background-color: var(--gray-50);
    }

    .slide-table tbody tr.active-box td {
      background-color: var(--teal-bg) !important;
      border-top: 2px solid var(--teal);
      border-bottom: 2px solid var(--teal);
    }

    .req-box {
      padding: 18px;
      background: var(--gray-50);
      border-radius: 10px;
      border: 2px solid var(--gray-200);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .req-box:hover {
      border-color: var(--teal);
      transform: translateY(-2px);
    }

    .req-box.active-box {
      background: var(--teal-bg);
      border: 2.5px solid var(--teal);
      box-shadow: 0 8px 20px rgba(57, 184, 178, 0.18);
    }

    .card-step-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: var(--navy);
      color: var(--teal);
      font-weight: 800;
      font-size: 16px;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 23px;
      font-weight: 800;
      color: var(--navy);
      margin-bottom: 10px;
      line-height: 1.35;
    }

    .navy-card .card-title {
      color: var(--teal);
    }

    .card-desc {
      font-size: 18px;
      color: var(--gray-700);
      line-height: 1.55;
    }

    .navy-card .card-desc {
      color: rgba(255, 255, 255, 0.88);
    }

    .tag-tbd {
      display: inline-block;
      background: var(--amber-bg);
      color: var(--amber);
      font-weight: 800;
      font-size: 14px;
      padding: 3px 9px;
      border-radius: 4px;
      border: 1px solid #FCD34D;
      vertical-align: middle;
    }

    .tag-virtual {
      display: inline-block;
      background: var(--blue-bg);
      color: var(--blue);
      font-weight: 800;
      font-size: 14px;
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid #BFDBFE;
    }

    /* Tables */
    .slide-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 19px;
      background: var(--white);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--gray-200);
    }

    .slide-table th {
      background: var(--navy);
      color: var(--white);
      padding: 16px 22px;
      text-align: left;
      font-weight: 700;
      font-size: 18px;
    }

    .slide-table th.teal-col {
      background: #163C45;
      color: var(--teal);
    }

    .slide-table td {
      padding: 16px 22px;
      border-bottom: 1px solid var(--gray-200);
      color: var(--gray-800);
      line-height: 1.45;
    }

    .slide-table tr:last-child td {
      border-bottom: none;
    }

    .slide-table td.row-label {
      font-weight: 800;
      color: var(--navy);
      background: var(--gray-50);
      width: 18%;
    }

    /* Prompt Copy Box */
    .prompt-container {
      background: #0F172A;
      color: #F8FAFC;
      border-radius: 12px;
      padding: 22px 26px;
      border: 2px solid var(--teal);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .prompt-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 10px;
    }

    .prompt-label {
      color: var(--teal);
      font-weight: 800;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .copy-btn {
      background: var(--teal);
      color: var(--navy);
      border: none;
      padding: 8px 18px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .copy-btn:hover {
      background: #4CE0DA;
    }

    .copy-btn.copied {
      background: #10B981;
      color: var(--white);
    }

    .prompt-text {
      font-family: 'Consolas', 'Monaco', 'Pretendard', monospace;
      font-size: 19px;
      line-height: 1.6;
      white-space: pre-wrap;
      user-select: all;
      color: #E2E8F0;
    }

    /* Popup Trigger Buttons */
    .popup-trigger-group {
      display: flex;
      gap: 10px;
    }

    .popup-btn {
      padding: 9px 18px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      border: 2px solid transparent;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s;
    }

    .popup-btn.type-check {
      background: var(--teal-bg);
      color: #0F766E;
      border-color: var(--teal);
    }

    .popup-btn.type-ref {
      background: var(--blue-bg);
      color: #1D4ED8;
      border-color: #93C5FD;
    }

    .popup-btn.type-ex {
      background: var(--amber-bg);
      color: #B45309;
      border-color: #FCD34D;
    }

    .popup-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
    }

    /* Interactive Checklist & Inputs */
    .check-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      background: var(--gray-50);
      border: 1px solid var(--gray-200);
      border-radius: 10px;
      font-size: 20px;
      font-weight: 700;
      color: var(--navy);
      cursor: pointer;
      transition: all 0.15s;
    }

    .check-item:hover {
      border-color: var(--teal);
      background: var(--teal-bg);
    }

    .check-item input[type="checkbox"] {
      width: 24px;
      height: 24px;
      accent-color: var(--teal-dark);
      cursor: pointer;
    }

    .input-field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-field-group label {
      font-size: 16px;
      font-weight: 800;
      color: var(--navy);
    }

    .slide-input, .slide-textarea {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid var(--gray-300);
      border-radius: 8px;
      font-size: 17px;
      font-family: inherit;
      background: var(--white);
      color: var(--gray-800);
    }

    .slide-input:focus, .slide-textarea:focus {
      outline: 2px solid var(--teal);
      border-color: transparent;
    }

    /* QR & Poll Box */
    .qr-placeholder-box {
      background: var(--gray-50);
      border: 2px dashed var(--gray-300);
      border-radius: 14px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 14px;
      height: 100%;
    }

    .qr-frame {
      width: 200px;
      height: 200px;
      background: var(--white);
      border: 2px solid var(--navy);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--navy);
      font-weight: 800;
      font-size: 17px;
      line-height: 1.4;
    }

    .poll-option {
      padding: 18px 22px;
      border: 2px solid var(--gray-200);
      border-radius: 10px;
      font-size: 21px;
      font-weight: 700;
      color: var(--navy);
      background: var(--white);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.15s;
    }

    .poll-option:hover, .poll-option.selected {
      border-color: var(--teal);
      background: var(--teal-bg);
    }

    /* Cover & Divider Specifics */
    .cover-layout {
      flex: 1;
      padding: 80px 80px 40px 80px;
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      align-items: center;
      gap: 50px;
      position: relative;
    }

    .divider-layout {
      flex: 1;
      padding: 90px 80px 50px 80px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .module-big-num {
      font-size: 24px;
      font-weight: 900;
      color: var(--teal);
      letter-spacing: 3px;
      margin-bottom: 16px;
      display: inline-block;
      border-bottom: 3px solid var(--teal);
      padding-bottom: 6px;
    }

    .divider-title {
      font-size: 56px;
      font-weight: 800;
      line-height: 1.25;
      color: var(--white);
      margin-bottom: 28px;
      max-width: 1100px;
    }

    .divider-question {
      font-size: 26px;
      color: rgba(255, 255, 255, 0.85);
      line-height: 1.5;
      max-width: 980px;
      font-weight: 500;
      border-left: 4px solid var(--teal);
      padding-left: 22px;
    }

    /* Modal / Popup */
    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(16, 29, 53, 0.72);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 60px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-window {
      background: var(--white);
      width: 100%;
      max-width: 920px;
      max-height: 720px;
      border-radius: 16px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-top: 8px solid var(--teal);
    }

    .modal-header {
      padding: 24px 32px;
      border-bottom: 1px solid var(--gray-200);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .modal-badge {
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 800;
    }

    .modal-title {
      font-size: 26px;
      font-weight: 800;
      color: var(--navy);
    }

    .modal-close-btn {
      background: var(--gray-100);
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 800;
      color: var(--gray-700);
      cursor: pointer;
    }

    .modal-close-btn:hover {
      background: var(--gray-200);
      color: var(--navy);
    }

    .modal-body {
      padding: 32px;
      overflow-y: auto;
      font-size: 21px;
      line-height: 1.65;
      color: var(--gray-800);
    }

    /* TOC Drawer */
    .toc-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(16, 29, 53, 0.78);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 110;
      padding: 50px;
    }

    .toc-backdrop.open {
      display: flex;
    }

    .toc-window {
      background: var(--white);
      width: 100%;
      max-width: 1320px;
      height: 760px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .toc-grid {
      padding: 28px 32px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .toc-module-box {
      border: 1px solid var(--gray-200);
      border-radius: 10px;
      padding: 18px;
      background: var(--gray-50);
    }

    .toc-module-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--navy);
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--teal);
      display: flex;
      justify-content: space-between;
    }

    .toc-slide-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .toc-slide-btn {
      text-align: left;
      background: var(--white);
      border: 1px solid var(--gray-200);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      color: var(--gray-700);
      cursor: pointer;

    // Fullscreen Toggle Logic
    function toggleFullscreen() {
      const docEl = document.documentElement;
      if (!document.fullscreenElement) {
        if (docEl.requestFullscreen) {
          docEl.requestFullscreen().catch(() => {});
        } else if (docEl.webkitRequestFullscreen) {
          docEl.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    function updateFullscreenButtonLabel() {
      const isFs = !!document.fullscreenElement;
      document.querySelectorAll('.fs-toggle-btn').forEach(btn => {

      closePopup();

    // Interactive Card / Box Click Delegation
    document.getElementById('slide-container').addEventListener('click', (e) => {
      // Ignore clicks directly on interactive form controls or buttons
      const ignoreTag = e.target.closest('button, input, textarea, a, label.check-item');
      if (ignoreTag) return;

      // 1. Cover workflow box click
      const coverBox = e.target.closest('.cover-flow-box');
      if (coverBox) {
        const parent = coverBox.parentElement;
        parent.querySelectorAll('.cover-flow-box').forEach(el => {
          if (el !== coverBox) el.classList.remove('active-box');
        });
        coverBox.classList.toggle('active-box');
        return;
      }

      // 2. Requirement template inner box click (Slide 31)
      const reqBox = e.target.closest('.req-box');
      if (reqBox) {
        const parent = reqBox.parentElement;
        parent.querySelectorAll('.req-box').forEach(el => {
          if (el !== reqBox) el.classList.remove('active-box');
        });
        reqBox.classList.toggle('active-box');
        return;
      }

      // 3. Table row click
      const tableRow = e.target.closest('.slide-table tbody tr');
      if (tableRow) {
        const tbody = tableRow.parentElement;
        tbody.querySelectorAll('tr').forEach(tr => {
          if (tr !== tableRow) tr.classList.remove('active-box');
        });
        tableRow.classList.toggle('active-box');
        return;
      }

      // 4. General .card click across all slides
      const card = e.target.closest('.card');
      if (card) {
        const parent = card.parentElement;
        if (parent) {
          parent.querySelectorAll(':scope > .card').forEach(sibling => {
            if (sibling !== card) {
              sibling.classList.remove('highlight', 'active-box');
            }
          });
        }
        if (card.classList.contains('highlight') || card.classList.contains('active-box')) {
          card.classList.remove('highlight', 'active-box');
        } else {
          card.classList.add('active-box');
        }
      }
    });

      const badge = document.getElementById('modal-badge-el');

        badge.style.color = '#B45309';

      modal.classList.add('open');
      document.getElementById('modal-close-button').focus();
    }

      const modal = document.getElementById('info-modal');

    // Copy Prompt with Fallback Selection
    function copyPromptText(btnEl, text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          showCopySuccess(btnEl);
        }).catch(() => {
          fallbackCopyText(btnEl);
        });
      } else {
        fallbackCopyText(btnEl);
      }
    }

    function fallbackCopyText(btnEl) {
      try {
        const promptBox = btnEl.closest('.prompt-container').querySelector('.prompt-text');
        const range = document.createRange();
        range.selectNodeContents(promptBox);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        document.execCommand('copy');
        showCopySuccess(btnEl);
      } catch (e) {
        btnEl.textContent = '아래 텍스트를 직접 드래그해 복사하세요';
      }
    }

    function showCopySuccess(btnEl) {
      const orig = btnEl.textContent;
      btnEl.classList.add('copied');
      btnEl.textContent = '✓ 복사 완료!';
      setTimeout(() => {
        btnEl.classList.remove('copied');
        btnEl.textContent = orig;
      }, 2000);
    }

      if (breakTimerInterval) {
        clearInterval(breakTimerInterval);
        breakTimerInterval = null;
      } else {
        breakTimerInterval = setInterval(() => {
          if (breakRemainingSeconds > 0) {
            breakRemainingSeconds--;
            const m = String(Math.floor(breakRemainingSeconds / 60)).padStart(2, '0');
            const s = String(breakRemainingSeconds % 60).padStart(2, '0');
            const el = document.getElementById('break-timer-display');
            if (el) el.textContent = `${m}:${s}`;
          } else {
            clearInterval(breakTimerInterval);
            breakTimerInterval = null;
          }
        }, 1000);
      }
    }

    function resetBreakTimer() {
      if (breakTimerInterval) {
        clearInterval(breakTimerInterval);
        breakTimerInterval = null;
      }
      breakRemainingSeconds = 600;
      const el = document.getElementById('break-timer-display');
      if (el) el.textContent = '10:00';
    }

    // TOC Drawer Generation
    function buildTOC() {
      const groups = [
        { title: '오프닝 및 모듈 1. AI 시대의 임원 업무', time: '30분 (01~09p)', range: [1, 9] },
        { title: '모듈 2. 공시자료와 경영 질문', time: '25분 (10~16p)', range: [10, 16] },
        { title: '모듈 3. AI 비교 브리핑 초안 + 휴식', time: '50분 (17~26p)', range: [17, 26] },
        { title: '모듈 4. 브리핑 보드 제작', time: '60분 (27~38p)', range: [27, 38] },
        { title: '모듈 5. 부서 실행 과제로 연결 + 휴식', time: '45분 (39~46p)', range: [39, 46] },
        { title: '모듈 6. AI 리더십과 조직 실행', time: '30분 (47~53p)', range: [47, 53] }
      ];

      const tocContent = document.getElementById('toc-content');
      tocContent.innerHTML = groups.map(g => {
        const slidesInGroup = SLIDES.filter(s => s.page >= g.range[0] && s.page <= g.range[1]);
        return `
          <div class="toc-module-box">
            <div class="toc-module-title">
              <span>${g.title}</span>
              <span style="color:var(--teal-dark); font-size:14px;">${g.time}</span>
            </div>
            <div class="toc-slide-list">
              ${slidesInGroup.map(s => `
                <button class="toc-slide-btn ${s.page === currentSlideIndex + 1 ? 'current-slide' : ''}" onclick="goToSlide(${s.page})">
                  <span style="color:var(--teal-dark); font-weight:800;">${String(s.page).padStart(2, '0')}</span>
                  <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${s.title}</span>
                </button>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleTOC(open) {
      const toc = document.getElementById('toc-modal');
      if (open) {
        buildTOC();
        toc.classList.add('open');
      } else {
        toc.classList.remove('open');
      }
    }

    // Keyboard Navigation Support
    window.addEventListener('keydown', (e) => {
      const tag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
      const isInputFocused = (tag === 'input' || tag === 'textarea');

      if (e.key === 'Escape') {
        closePopup();
        toggleTOC(false);
        return;
      }

      if (isInputFocused) return;

      const infoOpen = document.getElementById('info-modal').classList.contains('open');
      const tocOpen = document.getElementById('toc-modal').classList.contains('open');
      if (infoOpen || tocOpen) return;

      if (e.key === 'ArrowRight' || e.key === 'PageDown') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        prevSlide();
      }
    });

    // Initialize
    scaleStage();
    renderSlide(0);
  </script>
</body>
</html>

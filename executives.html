<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIbility Academy STEP-UP · Leader · 임원 | 유안타증권</title>
  <style>
    :root {
      --navy: #101D35;
      --navy-light: #1B2E52;
      --teal: #39B8B2;
      --teal-dark: #288f8a;
      --teal-bg: #EAF8F7;
      --white: #FFFFFF;
      --gray-50: #F8FAFC;
      --gray-100: #F1F5F9;
      --gray-200: #E2E8F0;
      --gray-300: #CBD5E1;
      --gray-600: #475569;
      --gray-700: #334155;
      --gray-800: #1E293B;
      --amber: #D97706;
      --amber-bg: #FEF3C7;
      --blue: #2563EB;
      --blue-bg: #EFF6FF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #09101D;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', '맑은 고딕', sans-serif;
      color: var(--gray-800);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: text;
    }

    /* 16:9 Presentation Stage */
    #stage-wrapper {
      width: 1600px;
      height: 900px;
      position: relative;
      transform-origin: center center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65);
      background: var(--white);
      overflow: hidden;
      border-radius: 4px;
    }

    /* Slide Base */
    .slide {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .slide.theme-navy {
      background-color: var(--navy);
      color: var(--white);
    }

    .slide.theme-white {
      background-color: var(--white);
      color: var(--gray-800);
    }

    /* Top Header for Content Slides */
    .slide-header {
      height: 76px;
      padding: 0 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--gray-200);
      background: var(--white);
      flex-shrink: 0;
    }

    .header-module-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .module-badge {
      background-color: var(--navy);
      color: var(--teal);
      font-weight: 700;
      font-size: 14px;
      padding: 5px 12px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }

    .module-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--gray-600);
    }

    /* Journey Pill Bar in Header */
    .journey-bar {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .journey-step {
      font-size: 13px;
      font-weight: 600;
      padding: 5px 11px;
      border-radius: 20px;
      color: var(--gray-600);
      background: var(--gray-100);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .journey-step.active {
      background: var(--teal);
      color: var(--navy);
      font-weight: 800;
    }

    .journey-arrow {
      color: var(--gray-300);
      font-size: 12px;
    }

    /* Main Slide Content Area */
    .slide-body {
      flex: 1;
      padding: 40px 60px 28px 60px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    .title-area {
      margin-bottom: 24px;
    }

    .slide-title {
      font-size: 38px;
      font-weight: 800;
      color: var(--navy);
      line-height: 1.25;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .slide-lead {
      font-size: 21px;
      color: var(--gray-600);
      margin-top: 10px;
      line-height: 1.5;
      font-weight: 500;
    }

    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 20px;
      min-height: 0;
    }

    /* Bottom Notice / Key Takeaway Bar */
    .bottom-message {
      margin-top: 18px;
      background: var(--gray-50);
      border-left: 5px solid var(--teal);
      padding: 14px 22px;
      font-size: 19px;
      font-weight: 700;
      color: var(--navy);
      border-radius: 0 8px 8px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    /* Slide Footer / Controls */
    .slide-footer {
      height: 62px;
      padding: 0 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(148, 163, 184, 0.25);
      font-size: 15px;
      flex-shrink: 0;
      z-index: 20;
    }

    .theme-navy .slide-footer {
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.75);
    }

    .footer-left, .footer-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .footer-copyright {
      font-size: 14px;
      font-weight: 600;
      color: var(--gray-600);
      letter-spacing: 0.2px;
    }

    .theme-navy .footer-copyright {
      color: rgba(255, 255, 255, 0.65);
    }

    .nav-btn {
      background: transparent;
      border: 1px solid var(--gray-300);
      color: var(--gray-700);
      padding: 7px 15px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .nav-btn:hover {
      background: var(--gray-100);
      border-color: var(--navy);
      color: var(--navy);
    }

    .theme-navy .nav-btn {
      border-color: rgba(255, 255, 255, 0.3);
      color: var(--white);
    }

    .theme-navy .nav-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--teal);
    }

    .page-indicator {
      font-size: 16px;
      font-weight: 800;
      padding: 0 12px;
      letter-spacing: 0.5px;
    }

    .page-indicator .current {
      color: var(--teal-dark);
    }

    .theme-navy .page-indicator .current {
      color: var(--teal);
    }

    /* Grid & Cards */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; height: 100%; align-items: stretch; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; height: 100%; align-items: stretch; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; height: 100%; align-items: stretch; }
    .grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; height: 100%; align-items: stretch; }
    .grid-2x2 { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 20px; height: 100%; }

    .card {
      background: var(--white);
      border: 2px solid var(--gray-200);
      border-radius: 12px;
      padding: 26px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 4px 12px rgba(16, 29, 53, 0.04);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    .card:hover {
      border-color: var(--teal);
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(16, 29, 53, 0.09);
    }

    .card.highlight,
    .card.active-box {
      border: 2.5px solid var(--teal) !important;
      background: linear-gradient(180deg, var(--teal-bg) 0%, #FFFFFF 100%);
      box-shadow: 0 12px 28px rgba(57, 184, 178, 0.22);
      transform: translateY(-3px);
    }

    .card.navy-card {
      background: var(--navy);
      color: var(--white);
      border-color: var(--navy);
    }

    .card.navy-card:hover {
      border-color: var(--teal);
    }

    .card.navy-card.active-box {
      background: var(--navy-light) !important;
      border: 2.5px solid var(--teal) !important;
      box-shadow: 0 12px 28px rgba(57, 184, 178, 0.3);
    }

    /* Cover workflow interactive boxes */
    .cover-flow-box {
      padding: 18px;
      background: rgba(255, 255, 255, 0.06);
      border: 1.5px solid rgba(255, 255, 255, 0.14);
      border-left: 5px solid var(--teal);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .cover-flow-box:hover {
      background: rgba(57, 184, 178, 0.12);
      border-color: var(--teal);
      transform: translateX(4px);
    }

    .cover-flow-box.active-box {
      background: rgba(57, 184, 178, 0.22);
      border: 2px solid var(--teal);
      border-left: 6px solid var(--teal);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      transform: translateX(6px);
    }

    .cover-flow-box.active-box .flow-title {
      color: var(--teal);
    }

    /* Cover Partner Logo Bar */
    .cover-logo-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .logo-badge-card {
      background: var(--white);
      padding: 10px 20px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 58px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28);
      border: 1.5px solid rgba(255, 255, 255, 0.85);
    }

    /* Interactive Table Rows & Requirement Boxes */
    .slide-table tbody tr {
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .slide-table tbody tr:hover td {
      background-color: var(--gray-50);
    }

    .slide-table tbody tr.active-box td {
      background-color: var(--teal-bg) !important;
      border-top: 2px solid var(--teal);
      border-bottom: 2px solid var(--teal);
    }

    .req-box {
      padding: 18px;
      background: var(--gray-50);
      border-radius: 10px;
      border: 2px solid var(--gray-200);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .req-box:hover {
      border-color: var(--teal);
      transform: translateY(-2px);
    }

    .req-box.active-box {
      background: var(--teal-bg);
      border: 2.5px solid var(--teal);
      box-shadow: 0 8px 20px rgba(57, 184, 178, 0.18);
    }

    .card-step-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: var(--navy);
      color: var(--teal);
      font-weight: 800;
      font-size: 16px;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 23px;
      font-weight: 800;
      color: var(--navy);
      margin-bottom: 10px;
      line-height: 1.35;
    }

    .navy-card .card-title {
      color: var(--teal);
    }

    .card-desc {
      font-size: 18px;
      color: var(--gray-700);
      line-height: 1.55;
    }

    .navy-card .card-desc {
      color: rgba(255, 255, 255, 0.88);
    }

    .tag-tbd {
      display: inline-block;
      background: var(--amber-bg);
      color: var(--amber);
      font-weight: 800;
      font-size: 14px;
      padding: 3px 9px;
      border-radius: 4px;
      border: 1px solid #FCD34D;
      vertical-align: middle;
    }

    .tag-virtual {
      display: inline-block;
      background: var(--blue-bg);
      color: var(--blue);
      font-weight: 800;
      font-size: 14px;
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid #BFDBFE;
    }

    /* Tables */
    .slide-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 19px;
      background: var(--white);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--gray-200);
    }

    .slide-table th {
      background: var(--navy);
      color: var(--white);
      padding: 16px 22px;
      text-align: left;
      font-weight: 700;
      font-size: 18px;
    }

    .slide-table th.teal-col {
      background: #163C45;
      color: var(--teal);
    }

    .slide-table td {
      padding: 16px 22px;
      border-bottom: 1px solid var(--gray-200);
      color: var(--gray-800);
      line-height: 1.45;
    }

    .slide-table tr:last-child td {
      border-bottom: none;
    }

    .slide-table td.row-label {
      font-weight: 800;
      color: var(--navy);
      background: var(--gray-50);
      width: 18%;
    }

    /* Prompt Copy Box */
    .prompt-container {
      background: #0F172A;
      color: #F8FAFC;
      border-radius: 12px;
      padding: 22px 26px;
      border: 2px solid var(--teal);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .prompt-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 10px;
    }

    .prompt-label {
      color: var(--teal);
      font-weight: 800;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .copy-btn {
      background: var(--teal);
      color: var(--navy);
      border: none;
      padding: 8px 18px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .copy-btn:hover {
      background: #4CE0DA;
    }

    .copy-btn.copied {
      background: #10B981;
      color: var(--white);
    }

    .prompt-text {
      font-family: 'Consolas', 'Monaco', 'Pretendard', monospace;
      font-size: 19px;
      line-height: 1.6;
      white-space: pre-wrap;
      user-select: all;
      color: #E2E8F0;
    }

    /* Popup Trigger Buttons */
    .popup-trigger-group {
      display: flex;
      gap: 10px;
    }

    .popup-btn {
      padding: 9px 18px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      border: 2px solid transparent;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s;
    }

    .popup-btn.type-check {
      background: var(--teal-bg);
      color: #0F766E;
      border-color: var(--teal);
    }

    .popup-btn.type-ref {
      background: var(--blue-bg);
      color: #1D4ED8;
      border-color: #93C5FD;
    }

    .popup-btn.type-ex {
      background: var(--amber-bg);
      color: #B45309;
      border-color: #FCD34D;
    }

    .popup-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
    }

    /* Interactive Checklist & Inputs */
    .check-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      background: var(--gray-50);
      border: 1px solid var(--gray-200);
      border-radius: 10px;
      font-size: 20px;
      font-weight: 700;
      color: var(--navy);
      cursor: pointer;
      transition: all 0.15s;
    }

    .check-item:hover {
      border-color: var(--teal);
      background: var(--teal-bg);
    }

    .check-item input[type="checkbox"] {
      width: 24px;
      height: 24px;
      accent-color: var(--teal-dark);
      cursor: pointer;
    }

    .input-field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-field-group label {
      font-size: 16px;
      font-weight: 800;
      color: var(--navy);
    }

    .slide-input, .slide-textarea {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid var(--gray-300);
      border-radius: 8px;
      font-size: 17px;
      font-family: inherit;
      background: var(--white);
      color: var(--gray-800);
    }

    .slide-input:focus, .slide-textarea:focus {
      outline: 2px solid var(--teal);
      border-color: transparent;
    }

    /* QR & Poll Box */
    .qr-placeholder-box {
      background: var(--gray-50);
      border: 2px dashed var(--gray-300);
      border-radius: 14px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 14px;
      height: 100%;
    }

    .qr-frame {
      width: 200px;
      height: 200px;
      background: var(--white);
      border: 2px solid var(--navy);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--navy);
      font-weight: 800;
      font-size: 17px;
      line-height: 1.4;
    }

    .poll-option {
      padding: 18px 22px;
      border: 2px solid var(--gray-200);
      border-radius: 10px;
      font-size: 21px;
      font-weight: 700;
      color: var(--navy);
      background: var(--white);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.15s;
    }

    .poll-option:hover, .poll-option.selected {
      border-color: var(--teal);
      background: var(--teal-bg);
    }

    /* Cover & Divider Specifics */
    .cover-layout {
      flex: 1;
      padding: 80px 80px 40px 80px;
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      align-items: center;
      gap: 50px;
      position: relative;
    }

    .divider-layout {
      flex: 1;
      padding: 90px 80px 50px 80px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .module-big-num {
      font-size: 24px;
      font-weight: 900;
      color: var(--teal);
      letter-spacing: 3px;
      margin-bottom: 16px;
      display: inline-block;
      border-bottom: 3px solid var(--teal);
      padding-bottom: 6px;
    }

    .divider-title {
      font-size: 56px;
      font-weight: 800;
      line-height: 1.25;
      color: var(--white);
      margin-bottom: 28px;
      max-width: 1100px;
    }

    .divider-question {
      font-size: 26px;
      color: rgba(255, 255, 255, 0.85);
      line-height: 1.5;
      max-width: 980px;
      font-weight: 500;
      border-left: 4px solid var(--teal);
      padding-left: 22px;
    }

    /* Modal / Popup */
    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(16, 29, 53, 0.72);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 60px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-window {
      background: var(--white);
      width: 100%;
      max-width: 920px;
      max-height: 720px;
      border-radius: 16px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-top: 8px solid var(--teal);
    }

    .modal-header {
      padding: 24px 32px;
      border-bottom: 1px solid var(--gray-200);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .modal-badge {
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 800;
    }

    .modal-title {
      font-size: 26px;
      font-weight: 800;
      color: var(--navy);
    }

    .modal-close-btn {
      background: var(--gray-100);
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 800;
      color: var(--gray-700);
      cursor: pointer;
    }

    .modal-close-btn:hover {
      background: var(--gray-200);
      color: var(--navy);
    }

    .modal-body {
      padding: 32px;
      overflow-y: auto;
      font-size: 21px;
      line-height: 1.65;
      color: var(--gray-800);
    }

    /* TOC Drawer */
    .toc-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(16, 29, 53, 0.78);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 110;
      padding: 50px;
    }

    .toc-backdrop.open {
      display: flex;
    }

    .toc-window {
      background: var(--white);
      width: 100%;
      max-width: 1320px;
      height: 760px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .toc-grid {
      padding: 28px 32px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .toc-module-box {
      border: 1px solid var(--gray-200);
      border-radius: 10px;
      padding: 18px;
      background: var(--gray-50);
    }

    .toc-module-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--navy);
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--teal);
      display: flex;
      justify-content: space-between;
    }

    .toc-slide-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .toc-slide-btn {
      text-align: left;
      background: var(--white);
      border: 1px solid var(--gray-200);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      color: var(--gray-700);
      cursor: pointer;
      display: flex;
      gap: 8px;
    }

    .toc-slide-btn:hover, .toc-slide-btn.current-slide {

              <span style="background:rgba(255,255,255,0.12); color:var(--white); padding:6px 18px; border-radius:20px; font-weight:700;">실행</span>
            </div>
            ${renderFooter(slide)}
          </div>
        `;
      } else if (slide.type === 'divider') {
        const flowItems = ['질문 설정', '공시 확인 · AI 분석', '브리핑 보드 제작', '부서 과제 · 실행 점검'];
        innerHTML = `
          <div class="slide theme-navy">
            <div class="divider-layout">
              <div>
                <div class="module-big-num">${slide.moduleCode} · ${slide.moduleName}</div>
                <h1 class="divider-title">${slide.title}</h1>
                <div class="divider-question">${slide.question}</div>
              </div>
              <div style="display:flex; align-items:center; justify-content:space-between; background:rgba(255,255,255,0.05); padding:22px 32px; border-radius:14px; border:1px solid rgba(255,255,255,0.12);">
                <span style="font-size:16px; font-weight:800; color:var(--teal);">전체 교육 여정에서의 위치</span>
                <div style="display:flex; align-items:center; gap:12px;">
                  ${flowItems.map((item, idx) => `
                    <div style="padding:10px 22px; border-radius:30px; font-weight:800; font-size:17px; ${idx === slide.activeCoverFlow ? 'background:var(--teal); color:var(--navy);' : 'background:rgba(255,255,255,0.1); color:rgba(255,255,255,0.65);'}">
                      ${idx + 1}. ${item}
                    </div>
                    ${idx < flowItems.length - 1 ? '<span style="color:rgba(255,255,255,0.35);">➔</span>' : ''}
                  `).join('')}
                </div>
              </div>
            </div>
            ${renderFooter(slide)}
          </div>
        `;
      } else {
        innerHTML = `
          <div class="slide theme-white">
            <div class="slide-header">
              <div class="header-module-info">
                <span class="module-badge">${slide.moduleCode}</span>
                <span class="module-name">${slide.moduleName}</span>
              </div>
              <div class="journey-bar">
                ${JOURNEY_STEPS.map((st, i) => `
                  <span class="journey-step ${slide.journeyActive && slide.journeyActive.includes(st.id) ? 'active' : ''}">
                    ${st.label}
                  </span>
                  ${i < JOURNEY_STEPS.length - 1 ? '<span class="journey-arrow">›</span>' : ''}
                `).join('')}
              </div>
            </div>
            <div class="slide-body">
              <div class="title-area">
                <div class="slide-title">
                  <span>${slide.title}</span>
                  ${slide.popup ? renderPopupButton(slide.popup) : ''}
                </div>
                ${slide.lead ? `<p class="slide-lead">${slide.lead}</p>` : ''}
              </div>
              <div class="content-area">
                ${slide.render ? slide.render() : ''}
              </div>
              ${slide.bottomMsg ? `<div class="bottom-message"><span>💡 ${slide.bottomMsg}</span></div>` : ''}
            </div>
            ${renderFooter(slide)}
          </div>
        `;
      }

      return innerHTML;
    }

    function renderSlide(index) {
      if (breakTimerInterval) {
        clearInterval(breakTimerInterval);
        breakTimerInterval = null;
      }

      if (SLIDES[index] && SLIDES[index].type === 'break') {
        breakRemainingSeconds = 600;
      }

      const container = document.getElementById('slide-container');
      container.innerHTML = getSlideHTML(index);
      if (index === 3 && window.refreshExecutivePoll) window.refreshExecutivePoll();
      if (index === 3 && window.refreshExecutivePoll) window.refreshExecutivePoll();
      updateFullscreenButtonLabel();
    }

    function renderPopupButton(popup) {
      const typeClass = popup.type === 'check' ? 'type-check' : (popup.type === 'ref' ? 'type-ref' : 'type-ex');
      const icon = popup.type === 'check' ? '✅' : (popup.type === 'ref' ? '📌' : '💡');
      return `
        <div class="popup-trigger-group">
          <button class="popup-btn ${typeClass}" onclick="openPopup(this)">
            <span>${icon}</span>
            <span>${popup.label}</span>
          </button>
        </div>
      `;
    }

    function renderFooter(slide) {
      const pageNumStr = String(slide.page).padStart(2, '0');
      const isFs = !!document.fullscreenElement;
      return `
        <div class="slide-footer">
          <div class="footer-left"><a class="nav-btn" href="index.html">⌂ 메인 화면</a>
            <button class="nav-btn" onclick="toggleTOC(true)" title="전체 목차 및 모듈 이동">
              ☰ 목차 · 모듈 이동
            </button>
            <button class="nav-btn" onclick="exportToPDF()" title="전체 50페이지 슬라이드를 PDF로 인쇄/저장합니다">
              🖨️ PDF 출력
            </button>
            <button class="nav-btn fs-toggle-btn" onclick="toggleFullscreen()" title="전체화면 보기 전환 (F)">
              ${isFs ? '🗗 전체화면 종료' : '⛶ 전체화면 보기'}
            </button>
          </div>
          <div class="footer-copyright">
            <span style="display:block; font-size:12px; color:inherit; font-weight:800;">AIbility Academy STEP-UP · Leader</span><span style="font-size:10px;">© 2026 Data Thinking Lab. All rights reserved</span>
          </div>
          <div class="footer-right">
            <button class="nav-btn" onclick="prevSlide()" ${slide.page === 1 ? 'disabled style="opacity:0.4; cursor:not-allowed;"' : ''}>
              ◀ 이전
            </button>
            <span class="page-indicator">
              <span class="current">${pageNumStr}</span> / 50
            </span>
            <button class="nav-btn" onclick="nextSlide()" ${slide.page === 50 ? 'disabled style="opacity:0.4; cursor:not-allowed;"' : ''}>
              다음 ▶
            </button>
          </div>
        </div>
      `;
    }

    // Fullscreen Toggle Logic
    function toggleFullscreen() {
      const docEl = document.documentElement;
      if (!document.fullscreenElement) {
        if (docEl.requestFullscreen) {
          docEl.requestFullscreen().catch(() => {});
        } else if (docEl.webkitRequestFullscreen) {
          docEl.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    function updateFullscreenButtonLabel() {
      const isFs = !!document.fullscreenElement;
      document.querySelectorAll('.fs-toggle-btn').forEach(btn => {
        btn.innerHTML = isFs ? '🗗 전체화면 종료' : '⛶ 전체화면 보기';
      });
    }

    document.addEventListener('fullscreenchange', () => {
      scaleStage();
      updateFullscreenButtonLabel();
    });

    // Export All 53 Slides to PDF
    function exportToPDF() {
      closePopup();
      toggleTOC(false);

      const printContainer = document.getElementById('print-all-container');
      printContainer.innerHTML = SLIDES.map((_, idx) => `
        <div class="print-slide-page">
          ${getSlideHTML(idx)}
        </div>
      `).join('');

      setTimeout(() => {
        window.print();
      }, 150);
    }

    window.addEventListener('afterprint', () => {
      const printContainer = document.getElementById('print-all-container');
      if (printContainer) {
        printContainer.innerHTML = '';
      }
    });

    // Interactive Card / Box Click Delegation
    document.getElementById('slide-container').addEventListener('click', (e) => {
      // Ignore clicks directly on interactive form controls or buttons
      const ignoreTag = e.target.closest('button, input, textarea, a, label.check-item');
      if (ignoreTag) return;

      // 1. Cover workflow box click
      const coverBox = e.target.closest('.cover-flow-box');
      if (coverBox) {
        const parent = coverBox.parentElement;
        parent.querySelectorAll('.cover-flow-box').forEach(el => {
          if (el !== coverBox) el.classList.remove('active-box');
        });
        coverBox.classList.toggle('active-box');
        return;
      }

      // 2. Requirement template inner box click (Slide 31)
      const reqBox = e.target.closest('.req-box');
      if (reqBox) {
        const parent = reqBox.parentElement;
        parent.querySelectorAll('.req-box').forEach(el => {
          if (el !== reqBox) el.classList.remove('active-box');
        });
        reqBox.classList.toggle('active-box');
        return;
      }

      // 3. Table row click
      const tableRow = e.target.closest('.slide-table tbody tr');
      if (tableRow) {
        const tbody = tableRow.parentElement;
        tbody.querySelectorAll('tr').forEach(tr => {
          if (tr !== tableRow) tr.classList.remove('active-box');
        });
        tableRow.classList.toggle('active-box');
        return;
      }

      // 4. General .card click across all slides
      const card = e.target.closest('.card');
      if (card) {
        const parent = card.parentElement;
        if (parent) {
          parent.querySelectorAll(':scope > .card').forEach(sibling => {
            if (sibling !== card) {
              sibling.classList.remove('highlight', 'active-box');
            }
          });
        }
        if (card.classList.contains('highlight') || card.classList.contains('active-box')) {
          card.classList.remove('highlight', 'active-box');
        } else {
          card.classList.add('active-box');
        }
      }
    });

    function prevSlide() {
      if (currentSlideIndex > 0) {
        currentSlideIndex--;
        renderSlide(currentSlideIndex);
      }
    }

    function nextSlide() {
      if (currentSlideIndex < SLIDES.length - 1) {
        currentSlideIndex++;
        renderSlide(currentSlideIndex);
      }
    }

    function goToSlide(pageNumber) {
      const idx = pageNumber - 1;
      if (idx >= 0 && idx < SLIDES.length) {
        currentSlideIndex = idx;
        renderSlide(currentSlideIndex);
        toggleTOC(false);
      }
    }

    // Popup Modal Logic with Focus Restoration
    function openPopup(triggerBtn) {
      lastFocusedElement = triggerBtn;
      const slide = SLIDES[currentSlideIndex];
      if (!slide.popup) return;

      const modal = document.getElementById('info-modal');
      const badge = document.getElementById('modal-badge-el');
      const title = document.getElementById('modal-title-text');
      const body = document.getElementById('modal-body-content');

      if (slide.popup.type === 'check') {
        badge.textContent = '실습 확인';
        badge.style.background = 'var(--teal-bg)';
        badge.style.color = '#0F766E';
      } else if (slide.popup.type === 'ref') {
        badge.textContent = '참고';
        badge.style.background = 'var(--blue-bg)';
        badge.style.color = '#1D4ED8';
      } else {
        badge.textContent = '예시';
        badge.style.background = 'var(--amber-bg)';
        badge.style.color = '#B45309';
      }

      title.textContent = slide.popup.title;
      body.innerHTML = slide.popup.html;
      modal.classList.add('open');
      document.getElementById('modal-close-button').focus();
    }

    function closePopup() {
      const modal = document.getElementById('info-modal');
      if (modal.classList.contains('open')) {
        modal.classList.remove('open');
        if (lastFocusedElement) {
          lastFocusedElement.focus();
        }
      }
    }

    document.getElementById('info-modal').addEventListener('click', closePopup);
    document.getElementById('toc-modal').addEventListener('click', () => toggleTOC(false));

    // Copy Prompt with Fallback Selection
    function copyPromptText(btnEl, text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          showCopySuccess(btnEl);
        }).catch(() => {
          fallbackCopyText(btnEl);
        });
      } else {
        fallbackCopyText(btnEl);
      }
    }

    function fallbackCopyText(btnEl) {
      try {
        const promptBox = btnEl.closest('.prompt-container').querySelector('.prompt-text');
        const range = document.createRange();
        range.selectNodeContents(promptBox);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        document.execCommand('copy');
        showCopySuccess(btnEl);
      } catch (e) {
        btnEl.textContent = '아래 텍스트를 직접 드래그해 복사하세요';
      }
    }

    function showCopySuccess(btnEl) {
      const orig = btnEl.textContent;
      btnEl.classList.add('copied');
      btnEl.textContent = '✓ 복사 완료!';
      setTimeout(() => {
        btnEl.classList.remove('copied');
        btnEl.textContent = orig;
      }, 2000);
    }

    // Break Timer Controls
    function toggleBreakTimer() {
      const disp = document.getElementById('break-timer-display');
      if (!disp) return;
      if (breakTimerInterval) {
        clearInterval(breakTimerInterval);
        breakTimerInterval = null;
      } else {
        breakTimerInterval = setInterval(() => {
          if (breakRemainingSeconds > 0) {
            breakRemainingSeconds--;
            const m = String(Math.floor(breakRemainingSeconds / 60)).padStart(2, '0');
            const s = String(breakRemainingSeconds % 60).padStart(2, '0');
            const el = document.getElementById('break-timer-display');
            if (el) el.textContent = `${m}:${s}`;
          } else {
            clearInterval(breakTimerInterval);
            breakTimerInterval = null;
          }
        }, 1000);
      }
    }

    function resetBreakTimer() {
      if (breakTimerInterval) {
        clearInterval(breakTimerInterval);
        breakTimerInterval = null;
      }
      breakRemainingSeconds = 600;
      const el = document.getElementById('break-timer-display');
      if (el) el.textContent = '10:00';
    }

    // TOC Drawer Generation
    function buildTOC() {
      const groups = [
        { title: '오프닝 및 모듈 1. AI 시대의 임원 업무', time: '30분 (01~09p)', range: [1, 9] },
        { title: '모듈 2. 공시자료와 경영 질문', time: '25분 (10~16p)', range: [10, 16] },
        { title: '모듈 3. AI 비교 브리핑 초안', time: '40분 (17~25p)', range: [17, 25] },
        { title: '모듈 4. 브리핑 보드 제작', time: '60분 (26~35p)', range: [26, 35] },
        { title: '모듈 5. 부서 실행 과제로 연결', time: '35분 (36~42p)', range: [36, 42] },
        { title: '모듈 6. AI 리더십과 조직 실행', time: '30분 (43~50p)', range: [43, 50] }
      ];

      const tocContent = document.getElementById('toc-content');
      tocContent.innerHTML = groups.map(g => {
        const slidesInGroup = SLIDES.filter(s => s.page >= g.range[0] && s.page <= g.range[1]);
        return `
          <div class="toc-module-box">
            <div class="toc-module-title">
              <span>${g.title}</span>
              <span style="color:var(--teal-dark); font-size:14px;">${g.time}</span>
            </div>
            <div class="toc-slide-list">
              ${slidesInGroup.map(s => `
                <button class="toc-slide-btn ${s.page === currentSlideIndex + 1 ? 'current-slide' : ''}" onclick="goToSlide(${s.page})">
                  <span style="color:var(--teal-dark); font-weight:800;">${String(s.page).padStart(2, '0')}</span>
                  <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${s.title}</span>
                </button>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleTOC(open) {
      const toc = document.getElementById('toc-modal');
      if (open) {
        buildTOC();
        toc.classList.add('open');
      } else {
        toc.classList.remove('open');
      }
    }

    // Keyboard Navigation Support
    window.addEventListener('keydown', (e) => {
      const tag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
      const isInputFocused = (tag === 'input' || tag === 'textarea');

      if (e.key === 'Escape') {
        closePopup();
        toggleTOC(false);
        return;
      }

      if (isInputFocused) return;

      const infoOpen = document.getElementById('info-modal').classList.contains('open');
      const tocOpen = document.getElementById('toc-modal').classList.contains('open');
      if (infoOpen || tocOpen) return;

      if (e.key === 'ArrowRight' || e.key === 'PageDown') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        prevSlide();
      }
    });

    // Initialize
    scaleStage();
    renderSlide(0);
  </script>

  <script src="executive-poll-config.js"></script>
  <script src="executive-poll.js"></script>

</body>

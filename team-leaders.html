<script>
  // ============================================================================
  // 1. STATE & WORKSHEET STORAGE (Persists across slides 09 -> 48)
  // ============================================================================
  const userState = {
    poll05: '',
    taskName: '',
    taskStart: '',
    taskEnd: '',
    taskPain: '',
    asIsStep1: '',
    asIsStep2: '',
    asIsStep3: '',
    asIsStep4: '',
    review13: '',
    bottleneckStage: '',
    bottleneckEvidence: '경험에 따른 추정 (기록 확인 필요)',
    bottleneckCause: '',
    bottleneckCheck: '',
    reviewAdopt: '',
    reviewHold: '',
    boardFeature: '',
    boardFeatureChosen: false,
    boardUser: '',
    boardAction: '',
    boardCondition: '',
    offScreenRule: '',
    projectPlan: '',
    projectPrd: '',
    propPurpose: '',
    propEvidence: '',
    propToBe: '',
    propOwner: '',
    propMetric: '',
    propSupport: '',
    fixSentence40: '',
    oneLineTask: '',
    oneLineIssue: '',
    oneLineFlow: '',
    oneLineMetric: '',
    oneLineSupport: '',
    pilotStage: '',
    pilotScope: '',
    pilotOwner: '',
    pilotCondition: '',
    roleRecorder: '',
    roleReviewer: '',
    roleException: '',
    roleCollab: '',
    metricItem: '',
    metricBoundary: '',
    axTried: '',
    axLimit: '',
    axSupport: '',
    firstAction: '',
    firstPartner: '',
    firstCheckDate: ''
  };

  function updateField(key, value) {
    userState[key] = value;
    if (key === 'boardFeature') userState.boardFeatureChosen = true;
    if (window.scheduleWorkshopSave) window.scheduleWorkshopSave(key);
    document.querySelectorAll('[data-prompt12-preview]').forEach(el => {
      el.textContent = buildPrompt12();
    });
    if (key === 'projectPlan' || key === 'projectPrd') refreshProjectPrompts();
  }

  function formatPrompt(value) {
    return value.replace(/\.\s+(?=\S)/g, '.\n\n');
  }

  const BOARD_PRESETS = [
    {title:'요청 누락 → 필수자료 확인 체크', desc:'빠진 자료를 접수 단계에서 먼저 확인합니다.', user:'접수 담당자 · 검토 팀장', condition:'필수자료 확인 상태가 모두 확인인지 점검', action:'미확인 항목은 보완 필요로 표시하고 확인 후 검토 인계', rule:'요청 안내문에 필수자료와 제출 기준을 안내', adopt:'접수 시 필수자료 확인을 앞당기는 실습용 개선안'},
    {title:'검토 대기 → 대기 사유와 다음 조치', desc:'멈춘 이유와 다음에 할 일을 함께 보여줍니다.', user:'검토 담당자 · 팀장', condition:'검토 대기 과제에 대기 사유와 다음 조치가 적혀 있는지 점검', action:'사유와 다음 조치를 확인하고 담당자가 보완 또는 일정 협의', rule:'검토 인계 시 대기 사유와 다음 조치를 함께 기록', adopt:'검토 대기 사유와 다음 조치를 공유하는 실습용 개선안'},
    {title:'후속조치 누락 → 완료 근거 확인', desc:'완료 표시와 함께 확인할 근거를 남깁니다.', user:'실행 담당자 · 확인 팀장', condition:'완료 처리할 과제에 확인 근거가 기록됐는지 점검', action:'근거가 없으면 확인 필요로 표시하고 담당자에게 확인', rule:'완료 보고 시 확인 근거를 함께 남기는 기준 안내', adopt:'완료 여부와 확인 근거를 함께 살피는 실습용 개선안'}
  ];

  function chooseBoardPreset(index) {
    const p = BOARD_PRESETS[index];
    if (!p) return;
    Object.assign(userState, {boardFeature:p.title,boardFeatureChosen:true,boardUser:p.user,boardCondition:p.condition,boardAction:p.action,offScreenRule:p.rule,reviewAdopt:p.adopt,reviewHold:'실제 자동 승인·발송은 보류하고 담당자와 팀장이 검토'});
    renderSlide();
    showToast('선택한 실습용 초안을 뒤 보드 실습에 연결했습니다.', true);
  }

  function copyDisplayedPrompt(button, label) {
    const prompt = button.closest('.unified-body').querySelector('[data-copy-prompt]');
    if (prompt) copyText(prompt.textContent, label);
  }

  function copyBoardWithData() {
    copyText(COMMON_DATA_TEXT + '\n\n' + PROMPT_26, '가상 데이터 8건 + 보드 생성 요청문 통합본');
  }

  function clearAllUserInputs() {
    if (!confirm('현재 화면에 입력한 모든 실습 메모를 삭제하시겠습니까?\n(삭제 후 초기 상태로 돌아갑니다.)')) return;
    Object.keys(userState).forEach(k => {
      if (k === 'bottleneckEvidence') userState[k] = '경험에 따른 추정 (기록 확인 필요)';
      else if (k === 'boardFeatureChosen') userState[k] = false;
      else if (k === 'boardFeature') userState[k] = '';
      else userState[k] = '';
    });
    if (window.scheduleWorkshopSave) window.scheduleWorkshopSave('taskName');
    renderSlide();
    showToast('작성한 모든 입력 메모가 초기화되었습니다.', true);
  }

  function resetWorkshop09to14() {
    if (!confirm('이 화면에서 작성한 9~14페이지의 실습 입력을 초기화하시겠습니까?\n9~13페이지에서 자동 저장된 내용도 빈 내용으로 갱신됩니다.')) return;
    const fields = ['taskName', 'taskPain', 'taskStart', 'taskEnd', 'asIsStep1', 'asIsStep2', 'asIsStep3', 'asIsStep4', 'review13', 'bottleneckStage', 'bottleneckCause', 'bottleneckCheck'];
    fields.forEach(key => { userState[key] = ''; });
    userState.bottleneckEvidence = '경험에 따른 추정 (기록 확인 필요)';
    if (document.body.classList.contains('unified-read')) {
      document.querySelectorAll('input[oninput], textarea[oninput], select[onchange]').forEach(el => {
        const handler = el.getAttribute('oninput') || el.getAttribute('onchange') || '';
        const match = handler.match(/updateField\('([^']+)'/);
        if (match && (fields.includes(match[1]) || match[1] === 'bottleneckEvidence')) el.value = userState[match[1]];
      });
      document.querySelectorAll('[data-prompt12-preview]').forEach(el => { el.textContent = buildPrompt12(); });
    } else {
      renderSlide();
    }
    if (window.scheduleWorkshopSave) window.scheduleWorkshopSave('taskName');
    showToast('9~14페이지 입력을 초기화했습니다. 저장 내용을 갱신하고 있습니다.', true);
  }

  // ============================================================================
  // 2. COMMON DATA & TEXT CONSTANTS
  // ============================================================================
  const COMMON_DATA_TEXT = `[교육용 가상 자료 — 본사 지원 업무 과제 8건]
- 기준일: 2026-11-16
- 담당자: 가상 역할 A, B, C (실제 사내 현황이나 규정을 의미하지 않음)

ID | 과제 | 담당 | 마감 | 상태 | 중요도 | 확인사항
T01 | 주간 보고자료 취합 | A | 2026-11-13 | 진행중 | 상 | 일부 원자료 미도착
T02 | 요청 양식 정리 | B | 2026-11-16 | 검토대기 | 중 | 필수 항목 확인 필요
T03 | 협업 부서 현황 확인 | C | 2026-11-18 | 대기 | 중 | 회신 기한 합의 필요
T04 | 회의 후속조치 정리 | A | 2026-11-12 | 완료 | 중 | 완료 기록 있음
T05 | 내부 보고 초안 검토 | B | 2026-11-15 | 검토대기 | 상 | 비교표 근거 위치 누락
T06 | 정례 점검 체크리스트 | C | 2026-11-20 | 진행중 | 하 | 항목 검토 중
T07 | 신규 요청 범위 확인 | A | 미정 | 대기 | 중 | 요청자와 기한 협의 필요
T08 | 자료 목록 갱신 | B | 2026-11-16 | 완료 | 하 | 완료 기록 있음

[사건 이력]
- T01: 11/10 접수, 11/11 자료 보완 요청, 11/16 일부 미도착
- T05: 11/12 초안 접수, 11/13 근거 위치 보완 요청, 11/16 미보완

  function buildDashboardReportPrompt(step) {
    const guard = '제공한 대시보드와 검증 메모에 근거해 작성하세요. 교육용 가상 수치는 실제 부서 실적으로 사용하지 말고, 화면 구현·기능 검증·현업 효과를 구분하세요. 없는 근거·수치·승인·검증 결과는 만들지 말고 확인 필요로 남기세요.';
    if (step === 0) return `당신은 팀장의 임원 보고자료 작성을 돕습니다. ${guard}\n\n[입력 자료]\n대시보드 화면 또는 HTML 코드: [첨부하거나 붙여 넣기]\n직접 확인한 기능과 검증 결과: [확인한 항목만 입력]\n검증하지 못한 부분·제약: [입력]\n대상 업무: ${projectValue(userState.taskName)}\n선택한 실습용 기능: ${userState.boardFeatureChosen ? projectValue(userState.boardFeature) : '확인 필요'}\n역할·다음 조치의 실습 초안: ${projectValue(userState.boardUser)} / ${projectValue(userState.boardAction)}\n임원에게 요청할 결정·지원: [입력]\n\n[출력: 임원 보고자료 1장 초안]\n1. 대시보드를 만든 목적과 사용 대상.\n2. 화면에서 확인되는 주요 지표·상태와 계산 기준.\n3. 실제 검증한 기능, 아직 검증하지 않은 부분과 운영상 한계.\n4. 화면을 보고 담당자와 팀장이 취할 다음 행동.\n5. 현업 적용을 위해 필요한 조건과 임원에게 요청할 결정·지원.\n화면에 없는 사항을 추측하지 마세요. 자료가 부족하면 먼저 확인 질문을 제시하세요.`;
    if (step === 1) return `앞서 작성한 대시보드 보고자료를 바탕으로 임원이 물을 예상 질문 6개와 답변 초안을 만들어 주세요. ${guard}\n\n질문은 지표·데이터 신뢰성, 실제로 검증한 기능, 현업 효과, 운영·보안·공동사용 한계, 실행 책임, 필요한 지원을 포함하세요.\n각 항목을 ‘예상 질문 / 짧은 답변 / 제공 자료의 근거 위치 / 답변 한계 / 추가 확인할 사항’으로 정리하세요.\n답을 뒷받침할 자료가 없으면 ‘현재 확인하지 못했습니다. 무엇을 어떻게 확인해 언제 보고할지 정하겠습니다’ 형태의 답변을 제안하되, 기한·담당자를 임의로 확정하지 마세요. 보고자료가 이 대화에 없으면 먼저 제공을 요청하세요.`;
    if (step === 2) return `당신은 임원 보고자료를 비판적으로 점검하는 독립 검토자(레드팀)입니다. 보고자의 주장을 그대로 받아들이지 말고 약한 근거와 반례를 찾으세요. ${guard}\n\n[대시보드 화면·코드 및 직접 확인한 검증 메모]\n[여기에 붙여 넣기]\n[보고자료 1장과 예상 Q&A]\n[여기에 붙여 넣기]\n\n다음을 점검하세요.\n• 가상 데이터를 실제 실적으로, 구현을 현업 성과로 오해하게 하는 표현.\n• 지표 계산·필터·상태 변경 결과와 보고 내용의 불일치.\n• 로컬 HTML의 저장·공동사용·접근 통제 한계와 실제 승인·발송 여부.\n• 실행·검토 책임과 지원 요청의 구체성.\n문제마다 ‘문제 주장 / 제공된 근거 또는 근거 부재 / 임원의 반박 질문 / 수정 권고 / 추가 확인할 자료’를 제시하세요. 실제 코드를 실행하지 않았다면 검증 완료라고 쓰지 마세요. 자료가 없으면 비판을 지어내지 말고 부족한 자료를 요청하세요.`;
    if (step === 3) return `앞서 만든 대시보드 보고자료와 예상 Q&A를 아래 레드팀 의견으로 보완해 주세요. ${guard}\n\n[레드팀 의견]\n[별도 검토 대화의 결과를 여기에 붙여 넣기]\n\n각 지적을 제공 자료와 대조해 ‘반영 / 추가 확인 / 반영하지 않음’과 이유를 정리하세요. 과장되거나 근거가 없는 문장은 삭제하거나 한계를 밝혀 수정하세요. 새로운 수치와 성과를 만들어 빈칸을 메우지 마세요.\n수정한 보고자료 1장, 예상 Q&A, 남은 확인 사항과 지원 요청을 제공하세요. 원래 자료 또는 검토 의견이 없으면 먼저 요청하세요.`;
    return `보완한 대시보드 보고자료와 Q&A를 임원 보고용 묶음으로 정리해 주세요. ${guard}\n\n1. 핵심 메시지·대시보드 확인 내용·한계·결정 요청이 담긴 보고자료 1장.\n2. 예상 질문과 근거·한계가 표시된 답변표.\n3. 레드팀 지적별 반영 여부와 아직 확인할 사항.\n4. 발표자가 사용할 간결한 도입 설명과 마무리 지원 요청.\n자료가 확인되지 않은 상태에서 보고 준비나 검증이 완료됐다고 단정하지 마세요.`;
  }

    const sections = [
      ['10페이지 · AI로 업무 단계 초안 작성', buildWorkflowDraftPrompt()],

      ['28페이지 · 부서 기능 간단 추가', `${PROMPT_29}\n\n※ 요청 전 대괄호에 문제·기능·사용자·확인 조건·다음 조치를 입력하세요.`],
      ['28페이지 확장 실습 1 · 기획서 작성', buildProjectPrompt(1)],

      ['37페이지 · 예상 질문과 답변', buildDashboardReportPrompt(1)],

  function downloadCoursePrompts(format) {
    if (format !== 'txt' && format !== 'md') return;
    const blob = new Blob(['\ufeff', buildCoursePromptFile()], {type: format === 'md' ? 'text/markdown;charset=utf-8' : 'text/plain;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `유안타증권_본사팀장_실습프롬프트.${format}`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToast('현재 입력을 반영한 프롬프트 파일을 저장했습니다.', true);
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  // ============================================================================
  // 6. NAVIGATION, POPUP, COPY & ACCESSIBILITY CONTROLLERS
  // ============================================================================
  let currentIndex = 0;
  let lastFocusedElement = null;

  function renderSlide() {
    const slide = SLIDES[currentIndex];
    const stage = document.getElementById('slide-stage');
    const header = document.getElementById('slide-header');
    const body = document.getElementById('slide-body');
    const pageIndicator = document.getElementById('page-indicator');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');

    // Theme switching (Navy cover/dividers vs White content slides)
    if (slide.theme === 'navy') {
      stage.classList.remove('white-theme');
      stage.classList.add('navy-theme');
      header.classList.add('hidden');
    } else {
      stage.classList.remove('navy-theme');
      stage.classList.add('white-theme');
      header.classList.remove('hidden');

      document.getElementById('header-module-badge').textContent = slide.module;
      document.getElementById('header-module-title').textContent = slide.moduleTitle;

      // Render top journey bar
      const journeyEl = document.getElementById('header-journey');
      journeyEl.innerHTML = JOURNEY_STEPS.map((step, idx) => `
        <span class="journey-pill px-2.5 py-0.5 rounded-full ${step === slide.journey ? 'active' : 'bg-slate-200 text-slate-600'}">${idx + 1}. ${step}</span>
        ${idx < JOURNEY_STEPS.length - 1 ? '<span class="text-slate-300">→</span>' : ''}
      `).join('');
    }

    // Render slide body
    body.innerHTML = slide.render();

    // Update footer indicator & buttons
    const pageNumStr = String(slide.page).padStart(2, '0');
    pageIndicator.textContent = `${pageNumStr} / 46`;
    btnPrev.disabled = currentIndex === 0;
    btnNext.disabled = currentIndex === SLIDES.length - 1;
  }

  function prevSlide() {
    if (currentIndex > 0) {
      currentIndex--;
      renderSlide();
    }
  }

  function nextSlide() {
    if (currentIndex < SLIDES.length - 1) {
      currentIndex++;
      renderSlide();
    }
  }

  function goToSlide(pageNumber) {
    const idx = SLIDES.findIndex(s => s.page === pageNumber);
    if (idx !== -1) {
      currentIndex = idx;
      closeToc();
      renderSlide();
    }
  }

  // Popup Modal Logic
  function isAnyModalOpen() {
    const popupOpen = !document.getElementById('popup-overlay').classList.contains('hidden');
    const tocOpen = !document.getElementById('toc-overlay').classList.contains('hidden');
    return popupOpen || tocOpen;
  }

  function openPopup(key) {
    const def = POPUPS[key];
    if (!def) return;
    lastFocusedElement = document.activeElement;
    document.getElementById('popup-title').textContent = def.title;
    document.getElementById('popup-content').innerHTML = def.render();
    const overlay = document.getElementById('popup-overlay');
    overlay.classList.remove('hidden');
    overlay.classList.add('flex');
    document.getElementById('popup-close-btn').focus();
  }

  function closePopup() {
    const overlay = document.getElementById('popup-overlay');
    overlay.classList.add('hidden');
    overlay.classList.remove('flex');
    if (lastFocusedElement) {
      lastFocusedElement.focus();
      lastFocusedElement = null;
    }
  }

    if (event.target.id === 'popup-overlay') {

    return titles[page] || `슬라이드 ${page}`;
  }

  // Clipboard Copy with Fallback & Notification
  async function copyText(text, label) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        showToast(`✅ [${label}] 복사 완료! (Ctrl+V로 붙여넣으세요)`, true);
        return;
      }
    } catch (err) {
      // Fallback below
    }

    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      if (ok) {
        showToast(`✅ [${label}] 복사 완료! (Ctrl+V로 붙여넣으세요)`, true);
      } else {
        showToast(`⚠️ 자동 복사에 실패했습니다. 텍스트 박스를 직접 드래그해 Ctrl+C로 복사해 주세요.`, false);
      }
    } catch (e) {
      showToast(`⚠️ 자동 복사에 실패했습니다. 텍스트 박스를 직접 드래그해 Ctrl+C로 복사해 주세요.`, false);
    }
  }

  let toastTimer = null;
  function showToast(message, isSuccess) {
    const toast = document.getElementById('copy-toast');
    toast.textContent = message;
    toast.className = `fixed bottom-20 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-xl shadow-2xl font-bold text-sm transition-all ${
      isSuccess ? 'bg-[#101D35] text-[#39B8B2] border-2 border-[#39B8B2]' : 'bg-rose-900 text-white border-2 border-rose-400'
    }`;
    toast.classList.remove('hidden');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toast.classList.add('hidden');
    }, 3200);
  }

  // Keyboard Navigation Guard (Prevents slide change when popup is open or typing in inputs)
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (!document.getElementById('popup-overlay').classList.contains('hidden')) {
        e.preventDefault();
        closePopup();
        return;
      }
      if (!document.getElementById('toc-overlay').classList.contains('hidden')) {
        e.preventDefault();
        closeToc();
        return;
      }
    }

    // Do not change slides if any modal is open
    if (isAnyModalOpen()) return;

    // Do not change slides if user is typing inside an input/textarea/select
    const tag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;

    if (e.key === 'ArrowRight' || e.key === 'PageDown') {
      e.preventDefault();
      nextSlide();
    } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
      e.preventDefault();
      prevSlide();
    }
  });

  // Initial render
  window.addEventListener('DOMContentLoaded', () => {
    renderSlide();
  });
</script>

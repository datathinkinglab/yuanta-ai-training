  // ============================================================================

  const COMMON_DATA_TEXT = `[교육용 가상 자료 — 본사 지원 업무 과제 8건]
- 기준일: 2026-11-16
- 담당자: 가상 역할 A, B, C (실제 사내 현황이나 규정을 의미하지 않음)

ID | 과제 | 담당 | 마감 | 상태 | 중요도 | 확인사항
T01 | 주간 보고자료 취합 | A | 2026-11-13 | 진행중 | 상 | 일부 원자료 미도착
T02 | 요청 양식 정리 | B | 2026-11-16 | 검토대기 | 중 | 필수 항목 확인 필요
T03 | 협업 부서 현황 확인 | C | 2026-11-18 | 대기 | 중 | 회신 기한 합의 필요
T04 | 회의 후속조치 정리 | A | 2026-11-12 | 완료 | 중 | 완료 기록 있음
T05 | 내부 보고 초안 검토 | B | 2026-11-15 | 검토대기 | 상 | 비교표 근거 위치 누락
T06 | 정례 점검 체크리스트 | C | 2026-11-20 | 진행중 | 하 | 항목 검토 중
T07 | 신규 요청 범위 확인 | A | 미정 | 대기 | 중 | 요청자와 기한 협의 필요
T08 | 자료 목록 갱신 | B | 2026-11-16 | 완료 | 하 | 완료 기록 있음

[사건 이력]
- T01: 11/10 접수, 11/11 자료 보완 요청, 11/16 일부 미도착
- T05: 11/12 초안 접수, 11/13 근거 위치 보완 요청, 11/16 미보완
- T07: 11/16 접수했으나 마감일 미기재
※ 이 기록은 일부 사례이므로 전체 평균 대기시간이나 업무별 병목 순위를 계산할 수 없음.

[지표 계산 규칙 (기준일 2026-11-16)]
- 전체: 8건 / 미완료: 6건 / 완료: 2건(T04, T08)
- 기한 경과 미완료: 2건(T01, T05) → 마감일 < 기준일 이고 상태가 완료가 아닌 경우 (미정은 제외)
- 오늘 마감 미완료: 1건(T02) → 마감일 = 기준일 이고 상태가 완료가 아닌 경우
- 기한 확인 필요: 1건(T07) → 마감일이 '미정'인 경우`;

  const PROMPT_12 = `아래는 부서 업무를 일반화하고 세부 내용을 가상화한 설명입니다. 업무명: [입력], 시작·종료: [입력], 현재 단계: [입력], 반복되는 어려움: [입력], 근거 상태: [기록 확인/경험에 따른 추정/확인 필요]. 현재 흐름을 단계·입력·담당 역할·처리 및 대기·완료 조건·다음 전달정보로 정리해 주세요. 제공하지 않은 시간과 원인은 만들지 마세요. 병목 후보와 추가 확인 질문을 제시하고 사실·가설을 구분하세요. 부서에서 검토할 개선 후보 2개를 제안하되 효과를 단정하지 마세요.`;

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  // ============================================================================
  // 6. NAVIGATION, POPUP, COPY & ACCESSIBILITY CONTROLLERS
  // ============================================================================
  let currentIndex = 0;
  let lastFocusedElement = null;

  function renderSlide() {
    const slide = SLIDES[currentIndex];
    const stage = document.getElementById('slide-stage');
    const header = document.getElementById('slide-header');
    const body = document.getElementById('slide-body');
    const pageIndicator = document.getElementById('page-indicator');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');

    // Theme switching (Navy cover/dividers vs White content slides)
    if (slide.theme === 'navy') {
      stage.classList.remove('white-theme');
      stage.classList.add('navy-theme');
      header.classList.add('hidden');
    } else {
      stage.classList.remove('navy-theme');
      stage.classList.add('white-theme');
      header.classList.remove('hidden');

      document.getElementById('header-module-badge').textContent = slide.module;
      document.getElementById('header-module-title').textContent = slide.moduleTitle;

      // Render top journey bar
      const journeyEl = document.getElementById('header-journey');
      journeyEl.innerHTML = JOURNEY_STEPS.map((step, idx) => `
        <span class="journey-pill px-2.5 py-0.5 rounded-full ${step === slide.journey ? 'active' : 'bg-slate-200 text-slate-600'}">${idx + 1}. ${step}</span>
        ${idx < JOURNEY_STEPS.length - 1 ? '<span class="text-slate-300">→</span>' : ''}
      `).join('');
    }

    // Render slide body
    body.innerHTML = slide.render();

    // Update footer indicator & buttons
    const pageNumStr = String(slide.page).padStart(2, '0');
    pageIndicator.textContent = `${pageNumStr} / 48`;
    btnPrev.disabled = currentIndex === 0;
    btnNext.disabled = currentIndex === SLIDES.length - 1;
  }

  function prevSlide() {
    if (currentIndex > 0) {
      currentIndex--;
      renderSlide();
    }
  }

  function nextSlide() {
    if (currentIndex < SLIDES.length - 1) {
      currentIndex++;
      renderSlide();
    }
  }

  function goToSlide(pageNumber) {
    const idx = SLIDES.findIndex(s => s.page === pageNumber);
    if (idx !== -1) {
      currentIndex = idx;
      closeToc();
      renderSlide();
    }
  }

  // Popup Modal Logic
  function isAnyModalOpen() {
    const popupOpen = !document.getElementById('popup-overlay').classList.contains('hidden');
    const tocOpen = !document.getElementById('toc-overlay').classList.contains('hidden');
    return popupOpen || tocOpen;
  }

  function openPopup(key) {
    const def = POPUPS[key];
    if (!def) return;
    lastFocusedElement = document.activeElement;
    document.getElementById('popup-title').textContent = def.title;
    document.getElementById('popup-content').innerHTML = def.render();
    const overlay = document.getElementById('popup-overlay');
    overlay.classList.remove('hidden');
    overlay.classList.add('flex');
    document.getElementById('popup-close-btn').focus();
  }

  function closePopup() {
    const overlay = document.getElementById('popup-overlay');
    overlay.classList.add('hidden');
    overlay.classList.remove('flex');
    if (lastFocusedElement) {
      lastFocusedElement.focus();
      lastFocusedElement = null;
    }
  }

  function handleOverlayClick(event) {
    if (event.target.id === 'popup-overlay') {
      closePopup();
    }
  }

    tocContent.innerHTML = modules.map(m => {

            <div class="space-y-1">
              ${items.map(item => `
                <button onclick="goToSlide(${item.page})" class="w-full text-left px-2.5 py-1.5 rounded-lg text-xs flex items-center justify-between transition ${currentIndex + 1 === item.page ? 'bg-[#101D35] text-[#39B8B2] font-bold' : 'hover:bg-slate-100 text-slate-700'}">
                  <span><strong>${String(item.page).padStart(2, '0')}p.</strong> ${getSlideShortTitle(item.page)}</span>
                  <span class="text-[10px] opacity-75">${item.journey}</span>
                </button>
              `).join('')}

          </div>
        </div>
      `;
    }).join('');

    const overlay = document.getElementById('toc-overlay');
    overlay.classList.remove('hidden');
    overlay.classList.add('flex');
    document.getElementById('toc-close-btn').focus();
  }

  function closeToc() {
    const overlay = document.getElementById('toc-overlay');

  // Clipboard Copy with Fallback & Notification
  async function copyText(text, label) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        showToast(`✅ [${label}] 복사 완료! (Ctrl+V로 붙여넣으세요)`, true);
        return;
      }
    } catch (err) {
      // Fallback below
    }

    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      if (ok) {
        showToast(`✅ [${label}] 복사 완료! (Ctrl+V로 붙여넣으세요)`, true);
      } else {
        showToast(`⚠️ 자동 복사에 실패했습니다. 텍스트 박스를 직접 드래그해 Ctrl+C로 복사해 주세요.`, false);
      }
    } catch (e) {
      showToast(`⚠️ 자동 복사에 실패했습니다. 텍스트 박스를 직접 드래그해 Ctrl+C로 복사해 주세요.`, false);
    }
  }

  let toastTimer = null;
  function showToast(message, isSuccess) {
    const toast = document.getElementById('copy-toast');
    toast.textContent = message;
    toast.className = `fixed bottom-20 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-xl shadow-2xl font-bold text-sm transition-all ${
      isSuccess ? 'bg-[#101D35] text-[#39B8B2] border-2 border-[#39B8B2]' : 'bg-rose-900 text-white border-2 border-rose-400'
    }`;
    toast.classList.remove('hidden');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toast.classList.add('hidden');
    }, 3200);
  }

  // Keyboard Navigation Guard (Prevents slide change when popup is open or typing in inputs)
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (!document.getElementById('popup-overlay').classList.contains('hidden')) {
        e.preventDefault();
        closePopup();
        return;
      }
      if (!document.getElementById('toc-overlay').classList.contains('hidden')) {
        e.preventDefault();
        closeToc();
        return;
      }
    }

    // Do not change slides if any modal is open
    if (isAnyModalOpen()) return;

    // Do not change slides if user is typing inside an input/textarea/select
    const tag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;

    if (e.key === 'ArrowRight' || e.key === 'PageDown') {
      e.preventDefault();
      nextSlide();
    } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
      e.preventDefault();
      prevSlide();
    }
  });

  // Initial render
  window.addEventListener('DOMContentLoaded', () => {
    renderSlide();
  });
</script>
